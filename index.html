<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24102f"><link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png"><title>Gin Counter</title>
<style>
:root{--bg:#120b18;--panel:#25172e;--text:#f6ead7;--muted:#cdbbcd;--accent:#d5a34a;--danger:#e48b8b;--ok:#9fcf78}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#42204f 0,transparent 48%),linear-gradient(#160c1d,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.app{width:min(100%,520px);margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.header-actions{display:flex;align-items:center;gap:8px}
.dashboard-link,.install-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff10;color:var(--text);font:inherit;text-decoration:none;white-space:nowrap}
.install-btn{cursor:pointer}
.install-btn[hidden]{display:none}
h1{margin:0;font:700 clamp(28px,8vw,42px) Georgia,serif}.subtitle{color:var(--muted);font-size:13px}.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff10;color:var(--text);font-size:20px}
.status{min-height:24px;margin-bottom:12px;color:var(--muted);font-size:14px}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}
.cards{display:grid;gap:16px}.card{overflow:hidden;background:linear-gradient(#35223f,var(--panel));border:1px solid #ffffff18;border-radius:24px;box-shadow:0 14px 35px #0005}
.card img{display:block;width:100%;height:clamp(165px,42vw,220px);object-fit:cover;object-position:center 52%}.content{padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.name{font:700 28px Georgia,serif}.count{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.counter-btn{min-height:64px;border-radius:18px;border:1px solid #ffffff20;font-size:34px;font-weight:700;touch-action:manipulation}
.counter-btn:active{transform:scale(.97)}.counter-btn:disabled{opacity:.4}.minus{background:#ffffff10;color:var(--text)}.plus{background:var(--accent);color:#24180c}
.refresh{width:100%;margin-top:16px;min-height:50px;border-radius:16px;border:1px solid #ffffff20;background:#ffffff10;color:var(--text);font:inherit}
footer{margin-top:22px;padding:8px 4px 2px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--text);text-decoration:none}
footer a:hover{text-decoration:underline}
dialog{width:min(calc(100% - 32px),430px);border:1px solid #ffffff20;border-radius:22px;padding:0;background:#23142c;color:var(--text)}dialog::backdrop{background:#050307cc;backdrop-filter:blur(4px)}
.dialog{padding:22px}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted);line-height:1.45}.dialog input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid #ffffff25;background:#ffffff10;color:var(--text);font-size:20px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.actions button{min-height:44px;padding:0 16px;border:0;border-radius:12px;font:inherit}.save{background:var(--accent);font-weight:700}.cancel{background:#ffffff10;color:var(--text)}
@media(min-width:760px){.app{width:min(100%,860px)}.cards{grid-template-columns:1fr 1fr}.card img{height:250px}}
</style></head>
<body><main class="app">
<header>
<div><h1>🍸 Gin Counter</h1><div class="subtitle">Sommernacht · Gin & Rum</div></div>
<div class="header-actions">
<a class="dashboard-link" href="/dashboard">Dashboard</a>
<button id="installButton" class="install-btn" type="button" hidden>Installieren</button>
<button id="keyButton" class="icon-btn" type="button" aria-label="Schlüssel ändern">🔑</button>
</div>
</header>
<div id="status" class="status">Lade aktuellen Stand …</div>
<section class="cards">
<article class="card"><img src="./gin.png" alt="Sommernacht Gin"><div class="content"><div class="head"><div class="name">Gin</div><div id="ginCount" class="count">–</div></div><div class="controls"><button class="counter-btn minus" data-drink="gin" data-change="-1">−</button><button class="counter-btn plus" data-drink="gin" data-change="1">+</button></div></div></article>
<article class="card"><img src="./rum.png" alt="Sommernacht Rum"><div class="content"><div class="head"><div class="name">Rum</div><div id="rumCount" class="count">–</div></div><div class="controls"><button class="counter-btn minus" data-drink="rum" data-change="-1">−</button><button class="counter-btn plus" data-drink="rum" data-change="1">+</button></div></div></article>
</section>
<button id="refreshButton" class="refresh">↻ Stand aktualisieren</button>
<footer>
  2026 Made with ❤️ and AI by
  <a href="https://robert.berlin" target="_blank" rel="noopener noreferrer">Robert Willemelis</a>
</footer>
</main>
<dialog id="keyDialog"><form id="keyForm"><div class="dialog"><h2>Zugang 🍸</h2><p>Geburtsjahr des GröTaZ (Größter Torsten aller Zeiten)?</p><input id="keyInput" type="number" inputmode="numeric" min="1900" max="2100" placeholder="JJJJ" required><div class="actions"><button id="cancelKey" class="cancel" type="button">Abbrechen</button><button class="save" type="submit">Speichern</button></div></div></form></dialog>
<script>
(()=>{const API="https://train-isp-check.vercel.app/api/drinks",STORE="gin-counter-key";
const $=id=>document.getElementById(id),e={gin:$("ginCount"),rum:$("rumCount"),status:$("status"),refresh:$("refreshButton"),keyBtn:$("keyButton"),install:$("installButton"),dlg:$("keyDialog"),form:$("keyForm"),input:$("keyInput"),cancel:$("cancelKey")},buttons=[...document.querySelectorAll(".counter-btn")];let resolver=null,deferredInstallPrompt=null;
function msg(t,c=""){e.status.textContent=t;e.status.className=("status "+c).trim()}function render(d){if(Number.isFinite(+d?.gin))e.gin.textContent=d.gin;if(Number.isFinite(+d?.rum))e.rum.textContent=d.rum}
function busy(v){buttons.forEach(b=>b.disabled=v);e.refresh.disabled=v}
async function load(){busy(true);msg("Lade aktuellen Stand …");try{const r=await fetch(API,{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d?.error||`HTTP ${r.status}`);render(d);msg("Aktueller Stand geladen.","ok")}catch(x){msg("Fehler: "+x.message,"error")}finally{busy(false)}}
function ask(){e.input.value=localStorage.getItem(STORE)||"";e.dlg.showModal();setTimeout(()=>{e.input.focus();e.input.select()},0);return new Promise(r=>resolver=r)}
async function key(){const v=localStorage.getItem(STORE);return v?Number(v):ask()}
e.form.addEventListener("submit",ev=>{ev.preventDefault();const v=e.input.value.trim();if(!/^\d{4}$/.test(v)){e.input.setCustomValidity("Bitte ein vierstelliges Jahr eingeben.");e.input.reportValidity();return}e.input.setCustomValidity("");localStorage.setItem(STORE,v);e.dlg.close();resolver?.(Number(v));resolver=null});
e.cancel.onclick=()=>{e.dlg.close();resolver?.(null);resolver=null};e.keyBtn.onclick=()=>ask();
async function change(drink,delta){const k=await key();if(!k){msg("Änderung abgebrochen.");return}busy(true);msg((drink==="gin"?"Gin":"Rum")+" wird geändert …");try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({drink,change:delta,key:k})}),d=await r.json();if(!r.ok){if(r.status===401||r.status===403)localStorage.removeItem(STORE);throw new Error(d?.error||`HTTP ${r.status}`)}render(d);msg("Stand aktualisiert.","ok")}catch(x){msg("Fehler: "+x.message,"error")}finally{busy(false)}}
buttons.forEach(b=>b.onclick=()=>change(b.dataset.drink,Number(b.dataset.change)));e.refresh.onclick=load;

function isInstalled(){
  return window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
}

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function updateInstallButton(){
  // Solange die Seite nicht bereits als installierte Standalone-PWA läuft,
  // bleibt der Installieren-Button sichtbar.
  e.install.hidden=isInstalled();
}

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  updateInstallButton();
});

window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  e.install.hidden=true;
  msg("App installiert.","ok");
});

e.install.addEventListener("click",async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    updateInstallButton();
    return;
  }

  if(isIOS()){
    alert("Auf iPhone/iPad: Teilen → Zum Home-Bildschirm.");
    return;
  }

  alert(
    "Die direkte Installation ist in diesem Browser noch nicht verfügbar. " +
    "Öffne das Browser-Menü und wähle „App installieren“ bzw. " +
    "„Zum Startbildschirm hinzufügen“."
  );
});

updateInstallButton();

if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));load()})();
</script></body></html>
