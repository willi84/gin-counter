<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sommernacht Gin-Counter</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050403;
  }

  body {
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.63095238));
    height: min(100vh, calc(100vw / 1.63095238));
    aspect-ratio: 1507 / 924;
    background: url("./background.png") center / contain no-repeat;
    overflow: hidden;
  }

  /* Dynamische Zahlen – exakt auf den leeren Schildflächen */
  .counter {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171009;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.035em;
    font-size: clamp(40px, 5.1vw, 78px);
    text-shadow: 0 1px 0 rgba(255,255,255,.10);
    pointer-events: none;
    transform-origin: center;
  }

  #ginCounter {
    left: 5.55%;
    top: 71.35%;
    width: 11.15%;
    height: 7.7%;
    transform: rotate(-1.8deg) skewY(-0.18deg);
  }

  #rumCounter {
    right: 5.00%;
    top: 71.10%;
    width: 11.70%;
    height: 7.9%;
    transform: rotate(1.55deg) skewY(0.16deg);
  }

  .counter.changed {
    animation: pulse .45s ease-out;
  }

  @keyframes pulse {
    0%   { scale: 1; }
    45%  { scale: 1.08; }
    100% { scale: 1; }
  }

  /* Dynamische Statusleiste – NICHT Teil des Hintergrundbildes */
  .status {
    position: absolute;
    z-index: 10;
    left: 1.55%;
    right: 1.55%;
    bottom: 0.75%;
    height: 5.35%;
    display: grid;
    grid-template-columns:
      auto
      minmax(150px, 1fr)
      auto
      1px
      auto
      1px
      auto
      1px
      auto;
    align-items: center;
    gap: clamp(5px, .65vw, 11px);
    padding: 0 clamp(8px, .9vw, 14px);

    color: #ead3a5;
    background:
      linear-gradient(180deg, rgba(19,12,7,.82), rgba(8,5,3,.90));
    border: 1px solid rgba(202,135,47,.50);
    border-radius: 4px;
    box-shadow:
      inset 0 1px 0 rgba(255,197,102,.08),
      inset 0 -1px 0 rgba(0,0,0,.55);

    font-size: clamp(8px, 1.0vw, 15px);
    line-height: 1;
    letter-spacing: .015em;
    text-transform: uppercase;
  }

  .progress-track {
    height: clamp(8px, .92vw, 14px);
    overflow: hidden;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(218,160,76,.34);
    border-radius: 2px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.55);
  }

  .progress-value {
    width: 100%;
    height: 100%;
    transform-origin: left center;
    background:
      repeating-linear-gradient(
        -45deg,
        #79a948 0 10px,
        #689640 10px 20px
      );
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .sep {
    width: 1px;
    height: 52%;
    min-height: 12px;
    background: rgba(226,195,139,.50);
  }

  .meta {
    display: flex;
    align-items: center;
    gap: .3em;
    white-space: nowrap;
  }

  .seconds,
  .value {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .value {
    color: #7dad49;
    font-weight: 700;
  }

  select {
    min-width: 7.6em;
    padding: .12em .38em;
    color: #ead3a5;
    background: #130d08;
    border: 1px solid rgba(211,143,52,.58);
    border-radius: 3px;
    font: inherit;
    outline: none;
  }

  @media (max-width: 900px), (max-height: 560px) {
    .optional { display: none; }
    .status {
      gap: 4px;
      padding-left: 6px;
      padding-right: 6px;
    }
  }
</style>
</head>
<body>
<main class="stage" aria-label="Sommernacht Gin- und Rum-Counter">
  <div id="ginCounter" class="counter" aria-label="Gin Counter"></div>
  <div id="rumCounter" class="counter" aria-label="Rum Counter"></div>

  <section class="status" aria-label="Aktualisierungsstatus">
    <span>Nächstes Update in</span>

    <div class="progress-track">
      <div id="progress" class="progress-value"></div>
    </div>

    <span id="seconds" class="seconds">-- Sek.</span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Letztes Update:</span>
      <span id="lastUpdate" class="value">--:--:--</span>
    </span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Heute:</span>
      <span id="today" class="value">--.--.----</span>
    </span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Intervall:</span>
      <select id="interval">
        <option value="10">10 Sek.</option>
        <option value="15">15 Sek.</option>
        <option value="30" selected>30 Sek.</option>
        <option value="60">60 Sek.</option>
        <option value="120">2 Min.</option>
      </select>
    </span>
  </section>
</main>

<script>
(() => {
  const DATA_URL = "./counter.json";
  const FALLBACK = { gin: 12, rum: 7 };

  const el = {
    gin: document.getElementById("ginCounter"),
    rum: document.getElementById("rumCounter"),
    progress: document.getElementById("progress"),
    seconds: document.getElementById("seconds"),
    lastUpdate: document.getElementById("lastUpdate"),
    today: document.getElementById("today"),
    interval: document.getElementById("interval")
  };

  let values = { gin: null, rum: null };
  let intervalSeconds = Number(el.interval.value);
  let startedAt = performance.now();
  let loading = false;

  const fmtDate = date => new Intl.DateTimeFormat("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(date);

  const fmtTime = date => new Intl.DateTimeFormat("de-DE", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  }).format(date);

  function animateNumber(node, from, to, duration = 650) {
    if (from === null || from === to) {
      node.textContent = String(to);
      return;
    }

    const start = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      node.textContent = String(Math.round(from + (to - from) * eased));

      if (p < 1) {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  }

  function setCounter(key, rawValue) {
    const next = Number(rawValue);

    if (!Number.isFinite(next)) {
      return;
    }

    const old = values[key];
    animateNumber(el[key], old, next);

    if (old !== null && old !== next) {
      el[key].classList.remove("changed");
      void el[key].offsetWidth;
      el[key].classList.add("changed");
    }

    values[key] = next;
  }

  function apply(data) {
    setCounter("gin", data.gin);
    setCounter("rum", data.rum);
    el.lastUpdate.textContent = fmtTime(new Date());
  }

  async function refresh() {
    if (loading) {
      return;
    }

    loading = true;

    try {
      const response = await fetch(`${DATA_URL}?ts=${Date.now()}`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      apply(await response.json());
    } catch (error) {
      // Beim direkten Öffnen per file:// blockieren Browser fetch().
      // Dann bleibt die Anwendung mit den lokalen Startwerten funktionsfähig.
      if (values.gin === null || values.rum === null) {
        apply(FALLBACK);
      }

      console.warn("counter.json konnte nicht geladen werden:", error);
    } finally {
      loading = false;
      startedAt = performance.now();
    }
  }

  function tick(now) {
    const elapsed = (now - startedAt) / 1000;
    const remaining = Math.max(0, intervalSeconds - elapsed);
    const ratio = Math.max(0, 1 - elapsed / intervalSeconds);

    el.progress.style.transform = `scaleX(${ratio})`;
    el.seconds.textContent = `${Math.ceil(remaining)} Sek.`;

    if (elapsed >= intervalSeconds && !loading) {
      refresh();
    }

    requestAnimationFrame(tick);
  }

  el.interval.addEventListener("change", () => {
    intervalSeconds = Number(el.interval.value);
    startedAt = performance.now();
  });

  function updateDate() {
    el.today.textContent = fmtDate(new Date());
  }

  updateDate();
  setInterval(updateDate, 60_000);

  apply(FALLBACK);
  refresh();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
