<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sommernacht Gin-Counter</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050403;
  }

  body {
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.63095238));
    height: min(100vh, calc(100vw / 1.63095238));
    aspect-ratio: 1507 / 924;
    background: url("./background.png") center / contain no-repeat;

    background: image-set(
      url("./background.webp") type("image/webp"),
      url("./background.png") type("image/png")
    ) center / contain no-repeat;
        overflow: hidden;
      }

  /* Dynamische Zahlen – exakt auf den leeren Schildflächen */
  .counter {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171009;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.035em;
    font-size: clamp(40px, 5.1vw, 78px);
    text-shadow: 0 1px 0 rgba(255,255,255,.10);
    pointer-events: none;
    transform-origin: center;
  }

  #ginCounter {
    left: 5.55%;
    top: 74%;
    width: 17%;
    height: 9%;
    transform: rotate(357deg) skewY(-0.18deg);
  }

  #rumCounter {
    right: 6%;
    top: 74.1%;
    width: 17%;
    height: 9%;
    transform: rotate(5deg) skewY(0.16deg);
  }

  .counter.changed {
    animation: pulse .45s ease-out;
  }

  @keyframes pulse {
    0%   { scale: 1; }
    45%  { scale: 1.08; }
    100% { scale: 1; }
  }

  /* Dynamische Statusleiste – NICHT Teil des Hintergrundbildes */
  .status {
    position: absolute;
    z-index: 10;
    left: 1.55%;
    right: 1.55%;
    bottom: 0.75%;
    height: 5.35%;
    display: grid;
    grid-template-columns:
      auto
      minmax(150px, 1fr)
      auto
      1px
      auto
      1px
      auto
      1px
      auto;
    align-items: center;
    gap: clamp(5px, .65vw, 11px);
    padding: 0 clamp(8px, .9vw, 14px);

    color: #ead3a5;
    background:
      linear-gradient(180deg, rgba(19,12,7,.82), rgba(8,5,3,.90));
    border: 1px solid rgba(202,135,47,.50);
    border-radius: 4px;
    box-shadow:
      inset 0 1px 0 rgba(255,197,102,.08),
      inset 0 -1px 0 rgba(0,0,0,.55);

    font-size: clamp(8px, 1.0vw, 15px);
    line-height: 1;
    letter-spacing: .015em;
    text-transform: uppercase;
  }

  .progress-track {
    height: clamp(8px, .92vw, 14px);
    overflow: hidden;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(218,160,76,.34);
    border-radius: 2px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.55);
  }

  .progress-value {
    width: 100%;
    height: 100%;
    transform-origin: left center;
    background:
      repeating-linear-gradient(
        -45deg,
        #79a948 0 10px,
        #689640 10px 20px
      );
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .sep {
    width: 1px;
    height: 52%;
    min-height: 12px;
    background: rgba(226,195,139,.50);
  }

  .meta {
    display: flex;
    align-items: center;
    gap: .3em;
    white-space: nowrap;
  }

  .seconds,
  .value {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .value {
    color: #7dad49;
    font-weight: 700;
  }

  select {
    min-width: 7.6em;
    padding: .12em .38em;
    color: #ead3a5;
    background: #130d08;
    border: 1px solid rgba(211,143,52,.58);
    border-radius: 3px;
    font: inherit;
    outline: none;
  }


  /* Kleiner Konfetti-Effekt bei einer tatsächlichen Erhöhung */
  .confetti-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    overflow: hidden;
    pointer-events: none;
  }

  .confetti-piece {
    position: absolute;
    width: clamp(5px, .65vw, 10px);
    height: clamp(8px, .95vw, 14px);
    opacity: 0;
    border-radius: 2px;
    animation: confetti-fall 1.25s ease-out forwards;
  }

  @keyframes confetti-fall {
    0% {
      opacity: 1;
      transform: translate3d(0, -8px, 0) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform:
        translate3d(var(--drift), clamp(80px, 13vh, 150px), 0)
        rotate(var(--spin));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .confetti-piece { display: none; }
  }

  @media (max-width: 900px), (max-height: 560px) {
    .optional { display: none; }
    .status {
      gap: 4px;
      padding-left: 6px;
      padding-right: 6px;
    }
  }
</style>
</head>
<body>
<main class="stage" aria-label="Sommernacht Gin- und Rum-Counter">
  <div id="ginCounter" class="counter" aria-label="Gin Counter"></div>
  <div id="rumCounter" class="counter" aria-label="Rum Counter"></div>
  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <section class="status" aria-label="Aktualisierungsstatus">
    <span>Nächstes Update in</span>

    <div class="progress-track">
      <div id="progress" class="progress-value"></div>
    </div>

    <span id="seconds" class="seconds">-- Sek.</span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Letztes Update:</span>
      <span id="lastUpdate" class="value">--:--:--</span>
    </span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Heute:</span>
      <span id="today" class="value">--.--.----</span>
    </span>

    <span class="sep"></span>

    <span class="meta">
      <span class="optional">Intervall:</span>
      <select id="interval">
        <option value="10">10 Sek.</option>
        <option value="15">15 Sek.</option>
        <option value="30" selected>30 Sek.</option>
        <option value="60">60 Sek.</option>
        <option value="120">2 Min.</option>
      </select>
    </span>
  </section>
</main>

<script>
(() => {
  const DATA_URL = "https://train-isp-check.vercel.app/api/gin";
  // const DATA_URL = "./counter.json";

  const el = {
    gin: document.getElementById("ginCounter"),
    rum: document.getElementById("rumCounter"),
    progress: document.getElementById("progress"),
    seconds: document.getElementById("seconds"),
    lastUpdate: document.getElementById("lastUpdate"),
    today: document.getElementById("today"),
    interval: document.getElementById("interval"),
    confetti: document.getElementById("confettiLayer")
  };

  let values = { gin: null, rum: null };
  let intervalSeconds = Number(el.interval.value);
  let startedAt = performance.now();
  let loading = false;

  const fmtDate = date => new Intl.DateTimeFormat("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(date);

  const fmtTime = date => new Intl.DateTimeFormat("de-DE", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  }).format(date);

  function animateNumber(node, from, to, duration = 650) {
    if (from === null || from === to) {
      node.textContent = String(to);
      return;
    }

    const start = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      node.textContent = String(Math.round(from + (to - from) * eased));

      if (p < 1) {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  }

  function celebrate(key) {
    const counter = el[key];
    const stage = counter.closest(".stage");
    const stageRect = stage.getBoundingClientRect();
    const counterRect = counter.getBoundingClientRect();

    const centerX =
      counterRect.left - stageRect.left + counterRect.width / 2;
    const startY =
      counterRect.top - stageRect.top + counterRect.height * 0.15;

    const colors = [
      "#f2c14e",
      "#7dad49",
      "#d45d9e",
      "#8f6bd8",
      "#f08a45"
    ];

    for (let i = 0; i < 20; i += 1) {
      const piece = document.createElement("i");
      piece.className = "confetti-piece";

      const x = centerX + (Math.random() - 0.5) * counterRect.width * 0.8;
      const delay = Math.random() * 0.18;
      const drift = (Math.random() - 0.5) * 110;
      const spin = (Math.random() * 720 - 360);

      piece.style.left = `${x}px`;
      piece.style.top = `${startY}px`;
      piece.style.background = colors[
        Math.floor(Math.random() * colors.length)
      ];
      piece.style.animationDelay = `${delay}s`;
      piece.style.setProperty("--drift", `${drift}px`);
      piece.style.setProperty("--spin", `${spin}deg`);

      el.confetti.appendChild(piece);

      piece.addEventListener("animationend", () => {
        piece.remove();
      }, { once: true });
    }
  }

  function setCounter(key, rawValue) {
    const next = Number(rawValue);

    if (!Number.isFinite(next)) {
      return;
    }

    const old = values[key];
    animateNumber(el[key], old, next);

    if (old !== null && old !== next) {
      el[key].classList.remove("changed");
      void el[key].offsetWidth;
      el[key].classList.add("changed");

      if (next > old) {
        celebrate(key);
      }
    }

    values[key] = next;
  }

  function apply(data) {
    setCounter("gin", data.gin);
    setCounter("rum", data.rum);
    el.lastUpdate.textContent = fmtTime(new Date());
  }

  async function refresh() {
    if (loading) {
      return;
    }

    loading = true;

    try {
      const response = await fetch(`${DATA_URL}?ts=${Date.now()}`, {
        cache: "no-store"
      });
      console.log(response)

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      apply(await response.json());
    } catch (error) {
      console.warn("Counter konnte nicht geladen werden:", error);
    } finally {
      loading = false;
      startedAt = performance.now();
    }
  }

  function tick(now) {
    const elapsed = (now - startedAt) / 1000;
    const remaining = Math.max(0, intervalSeconds - elapsed);
    const ratio = Math.max(0, 1 - elapsed / intervalSeconds);

    el.progress.style.transform = `scaleX(${ratio})`;
    el.seconds.textContent = `${Math.ceil(remaining)} Sek.`;

    if (elapsed >= intervalSeconds && !loading) {
      refresh();
    }

    requestAnimationFrame(tick);
  }

  el.interval.addEventListener("change", () => {
    intervalSeconds = Number(el.interval.value);
    startedAt = performance.now();
  });

  function updateDate() {
    el.today.textContent = fmtDate(new Date());
  }

  updateDate();
  setInterval(updateDate, 60_000);

  refresh();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
